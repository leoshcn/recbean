<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- surface-2 of each theme (Mist / deep Ink); src/theme.js overrides when forced -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef6ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#051810" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>录音豆</title>
    <script>
      // apply the stored theme before CSS paints (no flash); must never throw
      (function () {
        try {
          var t = localStorage.getItem('recbean-theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) { /* storage disabled: follow system */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
